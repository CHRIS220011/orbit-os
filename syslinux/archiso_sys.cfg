UI menu.c32
PROMPT 0

MENU TITLE ORBIT-OS 1.0

LABEL orbit
    MENU LABEL ORBIT-OS 1.0 (x86_64, BIOS)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% efi_no_storage_paranoia systemd.unit=graphical.target systemd.firstboot=no copytoram=n

LABEL orbit-basic
    MENU LABEL ORBIT-OS 1.0 (x86_64, BIOS) - basic mode
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% efi_no_storage_paranoia systemd.unit=multi-user.target systemd.firstboot=no copytoram=n

LABEL orbit-accessibility
    MENU LABEL ORBIT-OS 1.0 (x86_64, BIOS) - with speech
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% efi_no_storage_paranoia accessibility=on systemd.unit=graphical.target systemd.firstboot=no copytoram=n

LABEL memtest
    MENU LABEL Memtest86+ (RAM test)
    LINUX /boot/memtest86+/memtest
    APPEND -

LABEL reboot
    MENU LABEL System restart
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL System shutdown
    COM32 poweroff.c32
