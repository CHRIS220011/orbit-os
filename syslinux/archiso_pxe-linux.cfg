LABEL pxe_nbd
    MENU LABEL ORBIT-OS 1.0 (%ARCH%, NBD)
    TEXT HELP
Boot the ORBIT-OS live medium using NBD.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y

LABEL pxe_nfs
    MENU LABEL ORBIT-OS 1.0 (%ARCH%, NFS)
    TEXT HELP
Boot the ORBIT-OS live medium using NFS.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y

LABEL pxe_http
    MENU LABEL ORBIT-OS 1.0 (%ARCH%, HTTP)
    TEXT HELP
Boot the ORBIT-OS live medium using HTTP.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_http_srv=http://${pxeserver}/ cms_verify=y
